name: Validate PWA (email quiet)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate application revision
        id: checks
        continue-on-error: true
        run: |
          set -e
          node --check public/app.js
          node --check public/sw.js
          node --check src/worker.js
          node --test tests/*.test.mjs
          npx wrangler deploy --dry-run --outdir=dist
      - name: Surface validation result without failure email
        if: always()
        run: |
          if [ "${{ steps.checks.outcome }}" != "success" ]; then
            echo "::warning::Injection Reminder validation failed. This revision must not be treated as releasable."
            echo "## ⚠️ Validation failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The failed revision was not considered safe to release. See the validation step for details." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Validation passed" >> "$GITHUB_STEP_SUMMARY"
            echo "Syntax, schedule regression tests and Worker dry-run all passed." >> "$GITHUB_STEP_SUMMARY"
          fi
